<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- These are rewritten per page by scripts/build-routes.mjs after the
         build. Social crawlers (LINE, X, Slack) do not run JavaScript, so
         anything React sets at runtime is invisible to them — the values
         below are the entire preview. Keep each tag on one line. -->
    <title>JUN Official Site</title>
    <meta name="description" content="札幌在住のシンガーソングライター JUN のオフィシャルサイト。country music × J-pop をベースに、北海道らしい爽やかな音楽を届けています。" />
    <link rel="canonical" href="https://jun006.com/" />

    <!-- Open Graph — LINE, Facebook, Slack, Discord, iMessage -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JUN Official Site" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:url" content="https://jun006.com/" />
    <meta property="og:title" content="JUN Official Site" />
    <meta property="og:description" content="札幌在住のシンガーソングライター JUN のオフィシャルサイト。country music × J-pop をベースに、北海道らしい爽やかな音楽を届けています。" />
    <meta property="og:image" content="https://jun006.com/ogp.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="JUN" />

    <!-- X. The rebrand did not change the namespace: there is no x: prefix.
         Title, description and image fall through to the og: tags above, so
         they are deliberately not duplicated here. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Jun_006" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Italianno&family=Jost:wght@300;400;500;600;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Tells search engines that this site and those social accounts are
         the same artist. Static, so it needs no maintenance. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MusicGroup",
        "name": "JUN",
        "url": "https://jun006.com/",
        "image": "https://jun006.com/ogp.jpg",
        "description": "札幌在住のシンガーソングライター。country music×J-popをベースに北海道らしい爽やかな音楽を、共感しやすい歌詞に乗せて届けている。",
        "genre": ["J-Pop", "Country"],
        "foundingLocation": {
          "@type": "Place",
          "name": "札幌",
          "address": {
            "@type": "PostalAddress",
            "addressRegion": "北海道",
            "addressCountry": "JP"
          }
        },
        "sameAs": [
          "https://x.com/Jun_006",
          "https://www.youtube.com/@JunSapporo",
          "https://www.tiktok.com/@jun_0060",
          "https://www.instagram.com/jun_006/",
          "https://lit.link/en/teamJUNfficial2014"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
